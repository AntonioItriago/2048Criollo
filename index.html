<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>2048 Criollo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ===== MONETAG SDK ===== -->
<script src='//libtl.com/sdk.js' data-zone='12026349' data-sdk='show_12026349'></script>

<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --grid-bg: #2a3340;
    --cell-bg: #3a4554;
    --text: #f5f5f5;
    --accent: #f5c518;
    --accent2: #cf142b;
    --accent3: #00247d;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 500px;
    margin: 0 auto;
    padding: 8px;
  }

  /* ===== BANNER PUBLICITARIO ===== */
  #banner-container {
    background: var(--panel);
    border-radius: 8px;
    text-align: center;
    padding: 4px;
    margin-bottom: 8px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #banner-container img {
    max-width: 100%;
    max-height: 80px;
    border-radius: 6px;
    display: block;
  }

  /* Header */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .title {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin: 0;
  }

  .scores { display: flex; gap: 6px; }

  .score-box {
    background: var(--panel);
    padding: 6px 12px;
    border-radius: 8px;
    text-align: center;
    min-width: 70px;
  }

  .score-label {
    font-size: 10px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .score-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
  }

  /* Tablero */
  .board-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }

  .board {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 1 / 1;
    background: var(--grid-bg);
    border-radius: 12px;
    padding: 6px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 6px;
  }

  .cell { background: var(--cell-bg); border-radius: 8px; }

  .tile {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-weight: 700;
    transition: transform 0.15s ease, background 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .tile .emoji { font-size: 2.2em; line-height: 1; }
  .tile .name {
    font-size: 0.55em;
    text-align: center;
    padding: 0 2px;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .tile .value { font-size: 0.7em; color: rgba(255,255,255,0.7); }

  .tile-2    { background: #8d7b68; }
  .tile-4    { background: #c08b5c; }
  .tile-8    { background: #e0a96d; }
  .tile-16   { background: #d4a373; color:#fff;}
  .tile-32   { background: #e76f51; }
  .tile-64   { background: #f4a261; }
  .tile-128  { background: #e63946; }
  .tile-256  { background: #d62828; }
  .tile-512  { background: #00247d; }
  .tile-1024 { background: #cf142b; }
  .tile-2048 { background: linear-gradient(135deg, #f5c518, #cf142b, #00247d); }

  @keyframes pop {
    0% { transform: scale(0); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .tile.new { animation: pop 0.2s ease; }

  @keyframes merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .tile.merged { animation: merge 0.25s ease; }

  /* Controles */
  .controls { display: flex; gap: 8px; margin-top: 10px; }

  .btn {
    flex: 1;
    background: var(--panel);
    color: var(--text);
    border: none;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.96); }
  .btn-undo { background: linear-gradient(135deg, var(--accent3), #0033a0); }
  .btn-undo:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-new { background: linear-gradient(135deg, var(--accent2), #a01020); }

  /* Overlay Game Over */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    border-radius: 12px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    text-align: center;
    padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 28px; margin: 0 0 10px; color: var(--accent); }
  .overlay p { margin: 0 0 20px; color: #ccc; }
  .overlay .btn { max-width: 200px; }

  /* Modal de anuncio */
  .ad-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    color: #fff;
    padding: 20px;
    text-align: center;
  }
  .ad-modal.show { display: flex; }
  .ad-modal .spinner {
    width: 50px; height: 50px;
    border: 4px solid #333;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ad-modal .status { font-size: 16px; margin-top: 10px; }
  .ad-modal .error { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== BANNER PUBLICITARIO (Monetag + banner.jpg) ===== -->
  <div id="banner-container">
    <img src="banner.jpg" alt="Publicidad" onerror="this.style.display='none'" />
    <script>
      // El script de Monetag se carga desde el <head> con data-sdk='show_12026349'
      // Si necesitas forzar la carga del banner aquí, descomenta:
      // if (typeof show_12026349 === 'function') { show_12026349(); }
    </script>
  </div>

  <!-- Header -->
  <div class="header">
    <h1 class="title">🇻🇪 2048 Criollo</h1>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Puntos</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Mejor</div>
        <div class="score-value" id="best">0</div>
      </div>
    </div>
  </div>

  <!-- Tablero -->
  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

      <div class="overlay" id="overlay">
        <h2 id="overlay-title">¡Fin del Juego!</h2>
        <p id="overlay-msg">No hay más movimientos posibles.</p>
        <button class="btn btn-new" onclick="newGame()">🔄 Nueva Partida</button>
      </div>
    </div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <button class="btn btn-undo" id="btn-undo" onclick="handleUndo()">
      🎬 Ver Anuncio y Deshacer
    </button>
    <button class="btn btn-new" onclick="newGame()">
      🆕 Nueva Partida
    </button>
  </div>
</div>

<!-- Modal de anuncio recompensado -->
<div class="ad-modal" id="ad-modal">
  <div class="spinner"></div>
  <div>📺 Cargando anuncio...</div>
  <div class="status" id="ad-status">Esperando respuesta de Monetag</div>
</div>

<script>
/* ============================================================
   2048 CRIOLLO - Telegram Mini App (Monetag integrado)
   ============================================================ */

// Integración con Telegram
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0f1419');
  tg.setBackgroundColor('#0f1419');
}

// Escala de fichas
const TILES = {
  2:    { name: 'Masa Harina Pan',     emoji: '🫓' },
  4:    { name: 'Arepa Viuda',         emoji: '🥙' },
  8:    { name: 'Queso Blanco',        emoji: '🧀' },
  16:   { name: 'Arepa Pelúa',         emoji: '🥩' },
  32:   { name: 'Reina Pepiada',       emoji: '👑' },
  64:   { name: 'Cachapa',             emoji: '🌽' },
  128:  { name: 'Empanada Pabellón',   emoji: '🥟' },
  256:  { name: 'Patacón Zuliano',     emoji: '🍌' },
  512:  { name: 'Pabellón Criollo',    emoji: '🍛' },
  1024: { name: 'Sancocho de Gallina', emoji: '🍲' },
  2048: { name: 'Gran Banquete Criollo', emoji: '🎉' }
};

const SIZE = 4;
let board = [];
let score = 0;
let best = parseInt(localStorage.getItem('best2048') || '0', 10);
let previousState = null;
let canUndo = false;
let gameOver = false;
let won = false;

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlayEl = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayMsg = document.getElementById('overlay-msg');
const btnUndo = document.getElementById('btn-undo');
const adModal = document.getElementById('ad-modal');
const adStatus = document.getElementById('ad-status');

bestEl.textContent = best;

/* ---------- Inicialización ---------- */
function newGame() {
  board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
  score = 0;
  gameOver = false;
  won = false;
  previousState = null;
  canUndo = false;
  btnUndo.disabled = true;
  overlayEl.classList.remove('show');
  addRandomTile();
  addRandomTile();
  render();
}

function addRandomTile() {
  const empty = [];
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++)
      if (board[r][c] === 0) empty.push([r, c]);
  if (empty.length === 0) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  board[r][c] = Math.random() < 0.9 ? 2 : 4;
  return [r, c];
}

/* ---------- Renderizado ---------- */
function render(newTilePos = null, mergedPositions = []) {
  boardEl.querySelectorAll('.tile').forEach(t => t.remove());

  const rect = boardEl.getBoundingClientRect();
  const gap = 6;
  const padding = 6;
  const tileSize = (rect.width - padding * 2 - gap * (SIZE - 1)) / SIZE;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const v = board[r][c];
      if (v === 0) continue;

      const tile = document.createElement('div');
      const info = TILES[v] || { name: v, emoji: '✨' };
      tile.className = `tile tile-${v}`;
      tile.innerHTML = `
        <div class="emoji">${info.emoji}</div>
        <div class="name">${info.name}</div>
        <div class="value">${v}</div>
      `;

      const x = padding + c * (tileSize + gap);
      const y = padding + r * (tileSize + gap);
      tile.style.width = tileSize + 'px';
      tile.style.height = tileSize + 'px';
      tile.style.left = x + 'px';
      tile.style.top = y + 'px';

      if (newTilePos && newTilePos[0] === r && newTilePos[1] === c) {
        tile.classList.add('new');
      }
      if (mergedPositions.some(p => p[0] === r && p[1] === c)) {
        tile.classList.add('merged');
      }

      boardEl.appendChild(tile);
    }
  }

  scoreEl.textContent = score;
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    localStorage.setItem('best2048', best);
  }
}

/* ---------- Lógica de movimiento ---------- */
function saveState() {
  previousState = {
    board: JSON.parse(JSON.stringify(board)),
    score: score
  };
  canUndo = true;
  btnUndo.disabled = false;
}

function slide(row) {
  let arr = row.filter(v => v !== 0);
  const merged = [];
  for (let i = 0; i < arr.length - 1; i++) {
    if (arr[i] === arr[i + 1]) {
      arr[i] *= 2;
      score += arr[i];
      arr[i + 1] = 0;
      merged.push(i);
    }
  }
  arr = arr.filter(v => v !== 0);
  while (arr.length < SIZE) arr.push(0);
  return { result: arr, merged };
}

function move(direction) {
  if (gameOver) return;

  const before = JSON.stringify(board);
  const mergedPositions = [];

  if (direction === 'left') {
    for (let r = 0; r < SIZE; r++) {
      const { result, merged } = slide(board[r]);
      board[r] = result;
      merged.forEach(i => mergedPositions.push([r, i]));
    }
  } else if (direction === 'right') {
    for (let r = 0; r < SIZE; r++) {
      const { result, merged } = slide([...board[r]].reverse());
      board[r] = result.reverse();
      merged.forEach(i => mergedPositions.push([r, SIZE - 1 - i]));
    }
  } else if (direction === 'up') {
    for (let c = 0; c < SIZE; c++) {
      const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
      const { result, merged } = slide(col);
      for (let r = 0; r < SIZE; r++) board[r][c] = result[r];
      merged.forEach(i => mergedPositions.push([i, c]));
    }
  } else if (direction === 'down') {
    for (let c = 0; c < SIZE; c++) {
      const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
      const { result, merged } = slide(col);
      const rev = result.reverse();
      for (let r = 0; r < SIZE; r++) board[r][c] = rev[r];
      merged.forEach(i => mergedPositions.push([SIZE - 1 - i, c]));
    }
  }

  const after = JSON.stringify(board);
  if (before === after) return;

  saveState();
  const newPos = addRandomTile();
  render(newPos, mergedPositions);

  if (tg && tg.HapticFeedback) {
    if (mergedPositions.length > 0) {
      tg.HapticFeedback.notificationOccurred('success');
    } else {
      tg.HapticFeedback.impactOccurred('light');
    }
  }

  if (!won) {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 2048) {
          won = true;
          showOverlay('¡Ganaste! 🎉', '¡Lograste el Gran Banquete Criollo!', true);
          return;
        }
  }

  if (!hasMovesLeft()) {
    gameOver = true;
    showOverlay('¡Fin del Juego!', `Puntuación final: ${score}`, false);
  }
}

function hasMovesLeft() {
  for (let r = 0; r < SIZE; r++)
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === 0) return true;
      if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return true;
      if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return true;
    }
  return false;
}

function showOverlay(title, msg) {
  overlayTitle.textContent = title;
  overlayMsg.textContent = msg;
  overlayEl.classList.add('show');
}

/* ============================================================
   DESHACER CON ANUNCIO RECOMPENSADO DE MONETAG
   ============================================================ */
async function handleUndo() {
  if (!canUndo || !previousState) return;

  // Verificar que el SDK de Monetag esté cargado
  if (typeof window.show_12026349 !== 'function') {
    alert('⚠️ El anuncio no está disponible en este momento. Intenta más tarde.');
    return;
  }

  adModal.classList.add('show');
  adStatus.textContent = 'Reproduciendo anuncio...';
  adStatus.className = 'status';

  try {
    // Llamar al anuncio recompensado de Monetag
    await window.show_12026349();

    // Si llega aquí, el usuario vio el anuncio completo → otorgar recompensa
    adStatus.textContent = '✅ ¡Anuncio completado! Restaurando partida...';

    setTimeout(() => {
      board = previousState.board;
      score = previousState.score;
      canUndo = false;
      btnUndo.disabled = true;
      previousState = null;
      gameOver = false;
      overlayEl.classList.remove('show');
      render();

      adModal.classList.remove('show');

      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }, 800);

  } catch (err) {
    // El usuario cerró el anuncio antes de tiempo o hubo error
    console.error('Error en anuncio Monetag:', err);
    adStatus.textContent = '❌ Anuncio cancelado o no disponible';
    adStatus.className = 'status error';

    setTimeout(() => {
      adModal.classList.remove('show');
    }, 1500);
  }
}

/* ---------- Controles: teclado ---------- */
document.addEventListener('keydown', (e) => {
  const map = {
    'ArrowLeft': 'left', 'ArrowRight': 'right',
    'ArrowUp': 'up', 'ArrowDown': 'down',
    'a': 'left', 'd': 'right', 'w': 'up', 's': 'down'
  };
  if (map[e.key]) {
    e.preventDefault();
    move(map[e.key]);
  }
});

/* ---------- Controles: swipe táctil ---------- */
let startX = 0, startY = 0, tracking = false;

document.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
  tracking = true;
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!tracking) return;
  tracking = false;
  const diffX = e.changedTouches[0].clientX - startX;
  const diffY = e.changedTouches[0].clientY - startY;
  const absX = Math.abs(diffX);
  const absY = Math.abs(diffY);
  const threshold = 30;

  if (Math.max(absX, absY) < threshold) return;

  if (absX > absY) {
    move(diffX > 0 ? 'right' : 'left');
  } else {
    move(diffY > 0 ? 'down' : 'up');
  }
}, { passive: true });

window.addEventListener('resize', () => render());

/* ---------- Arranque ---------- */
newGame();
</script>
</body>
</html>
